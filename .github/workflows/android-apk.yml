# Free Android APK build on GitHub's runners (no EAS quota needed).
# Trigger manually: Actions → Build Android APK → Run workflow.
# The APK appears as a downloadable artifact on the workflow run.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Generate the native android/ project from the Expo config
      - run: npx expo prebuild --platform android --no-install
      # Sign with a debug-style release keystore generated in CI (personal distribution)
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/wyr-release.keystore \
            -alias wyr -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wyr-release -keypass wyr-release \
            -dname "CN=Would You Rather, OU=Personal, O=HairLab, L=Cairo, S=Cairo, C=EG"
      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file('wyr-release.keystore')
                      storePassword 'wyr-release'
                      keyAlias 'wyr'
                      keyPassword 'wyr-release'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: would-you-rather.apk
          path: android/app/build/outputs/apk/release/app-release.apk
