# Free unsigned iOS IPA build on GitHub's macOS runners (public repo = free).
# Trigger manually: Actions → Build unsigned iOS IPA → Run workflow.
# The IPA is unsigned: install it on a personal device with Sideloadly / AltStore (free Apple ID, re-signs every 7 days).
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the native ios/ project from the Expo config
      - run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile for iPhone without code signing
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP=$(find ios/build/Build/Products -name '*.app' -path '*iphoneos*' -print -quit)
          test -n "$APP"
          mkdir -p ios/build/package/Payload
          cp -R "$APP" ios/build/package/Payload/
          (cd ios/build/package && /usr/bin/zip -qry ../would-you-rather-unsigned.ipa Payload)
          test -s ios/build/would-you-rather-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: would-you-rather-unsigned.ipa
          path: ios/build/would-you-rather-unsigned.ipa
